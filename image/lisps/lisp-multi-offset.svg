<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="100%" height="100%">
  <defs>
    <pattern id="cadGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#222832" stroke-width="0.8"/>
    </pattern>
    <linearGradient id="cmdBarGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14181f"/>
      <stop offset="100%" stop-color="#0c0e12"/>
    </linearGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="480" height="300" rx="8" fill="#15191f" stroke="#2a3340" stroke-width="2"/>
  <rect width="480" height="255" fill="url(#cadGrid)"/>

  <!-- Viewport Controls (Lee Mac / AutoCAD style) -->
  <text x="14" y="22" font-family="'Consolas', 'Courier New', monospace" font-size="11" fill="#78889b">[-][Top][2D Wireframe]</text>

  <!-- Top Right Watermark Badge -->
  <rect x="348" y="10" width="120" height="20" rx="4" fill="#1f2632" stroke="#323e50" stroke-width="1"/>
  <text x="408" y="24" font-family="'Consolas', monospace" font-size="10" font-weight="bold" fill="#00e5ff" text-anchor="middle">AUTOLISP &bull; CAD</text>

  <!-- UCS Icon (Bottom Left) -->
  <g transform="translate(14, 212)">
    <line x1="12" y1="20" x2="12" y2="2" stroke="#4caf50" stroke-width="2"/>
    <polygon points="12,0 9,6 15,6" fill="#4caf50"/>
    <text x="10" y="-3" font-family="sans-serif" font-size="10" font-weight="bold" fill="#4caf50" text-anchor="middle">Y</text>

    <line x1="12" y1="20" x2="30" y2="20" stroke="#f44336" stroke-width="2"/>
    <polygon points="32,20 26,17 26,23" fill="#f44336"/>
    <text x="38" y="23" font-family="sans-serif" font-size="10" font-weight="bold" fill="#f44336">X</text>

    <rect x="9" y="17" width="6" height="6" fill="none" stroke="#cfd8dc" stroke-width="1"/>
    <text x="12" y="32" font-family="'Consolas', monospace" font-size="8" fill="#78909c" text-anchor="middle">WCS</text>
  </g>

  <!-- Command Line Bar (Bottom) -->
  <rect x="0" y="255" width="480" height="45" fill="url(#cmdBarGrad)" stroke="#232a35" stroke-width="1"/>
  <rect x="10" y="262" width="460" height="30" rx="4" fill="#181e26" stroke="#2d3747" stroke-width="1"/>
  <text x="20" y="281" font-family="'Consolas', 'Courier New', monospace" font-size="11" fill="#ffffff">
    <tspan fill="#00e5ff" font-weight="bold">Command:</tspan> MIO <tspan fill="#90a4ae">&lt;Specify offset distance &lt;0.50&gt;: 4 entities offset&gt;</tspan>
  </text>
  <!-- Concentric Shapes Offset -->
  <polygon points="120,65 360,65 320,195 160,195" fill="none" stroke="#e0e0e0" stroke-width="2"/>
  <polygon points="135,80 345,80 310,180 170,180" fill="none" stroke="#00e5ff" stroke-width="2"/>
  <polygon points="150,95 330,95 300,165 180,165" fill="none" stroke="#ffd600" stroke-width="2"/>
  <polygon points="165,110 315,110 290,150 190,150" fill="none" stroke="#4caf50" stroke-width="2"/>
  <!-- Offset Arrows -->
  <line x1="240" y1="65" x2="240" y2="110" stroke="#ff4081" stroke-width="2"/>
  <polygon points="240,110 237,102 243,102" fill="#ff4081"/>
  <text x="250" y="90" font-family="'Consolas', monospace" font-size="10" font-weight="bold" fill="#ff4081">Offset: 0.50m</text>
  <!-- AutoCAD Crosshair Cursor -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.85">
    <line x1="205" y1="100" x2="275" y2="100"/>
    <line x1="240" y1="65" x2="240" y2="135"/>
    <rect x="235" y="95" width="10" height="10" fill="none" stroke="#ffffff" stroke-width="1"/>
  </g>
</svg>